      if (message.action === 'addFileReferences') {

        CodexGui.receive({type:'fileReferences',items:previewState.fileReferences});

        const remaining = [...previewState.fileReferences];

          return index < 0 ? null : remaining.splice(index, 1)[0];
        }).filter(Boolean);
      }
      if (message.action === 'listProjectFiles') {
        const query = String(message.query || '').toLowerCase();
